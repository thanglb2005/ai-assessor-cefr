name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-guards:
    name: Tài liệu và file bị cấm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kiểm tra link Markdown
        run: python scripts/ci/check_md_links.py
      - name: Chặn audio, model, DB, bí mật
        run: python scripts/ci/check_forbidden_files.py

  tests:
    name: Unit test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài đặt
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Chạy test (không gồm smoke)
        run: python -m pytest -q -m "not smoke" --cov=aicefr --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
      - name: Ruff
        run: ruff check src tests scripts
